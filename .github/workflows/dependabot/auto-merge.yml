name: Dependabot auto-merge
on:
  workflow_run:
    workflows: ["CI / On pull request"]
    types:
      - completed

jobs:
  dependabot:
    name: Dependabot
    runs-on: ubuntu-24.04
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      fromJSON(toJSON(github.event.workflow_run.pull_requests)).length > 0
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Log Github actor
        run: echo "The workflow was triggered by ${{ github.actor }}"

      - name: Dependabot metadata
        if: github.actor == 'dependabot[bot]' || github.actor == 'dependabot-preview[bot]'
        id: metadata
        uses: dependabot/fetch-metadata@v2.0.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-approve PR
        if: |
          (github.actor == 'dependabot[bot]' || github.actor == 'dependabot-preview[bot]') &&
          (contains(steps.metadata.outputs.dependency-names, 'go.mod') ||
           contains(steps.metadata.outputs.dependency-names, 'go.sum') ||
           contains(steps.metadata.outputs.dependency-names, 'package.json'))
        uses: actions/github-script@v7.1.1
        with:
          script: |
            github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.workflow_run.pull_requests[0].number,
              event: 'APPROVE'
            })
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for Dependabot PRs
        if: |
          (github.actor == 'dependabot[bot]' || github.actor == 'dependabot-preview[bot]') &&
          (contains(steps.metadata.outputs.dependency-names, 'go.mod') ||
           contains(steps.metadata.outputs.dependency-names, 'go.sum') ||
           contains(steps.metadata.outputs.dependency-names, 'package.json'))
        run: |
          if [[ -z "$PR_URL" ]]; then
            echo "Error: No pull request URL found"
            exit 1
          fi
          gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ fromJSON(toJSON(github.event.workflow_run.pull_requests))[0].url }}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
