# DESCRIPTION: On all merged pull requests, install dependencies, execute unit tests, apply linting,
# update any SSM parameters, build & deploy solution, and notifiy ChatOps channels. No areas of
# code are ignored, all patterns monitored for changes.

name: CD code / On push to develop/main
on:
  workflow_dispatch: # Need to test the manual trigger. What does environment mean and map to?
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        type: choice
        options:
          - develop
          - test
          - prod
        default: 'develop'
  push:
    branches:
      - main
      - develop
      - "dependabot/*"
    paths-ignore:
      - "**/*.md"

jobs:
  buildTestAndDeploy:
    name: Build, test, and deploy

    # Custom runner based on ubuntu-latest.
    runs-on: CBGCore-HighCharity-GitHubRunner01

    environment: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
          format('Arcadia {0}',
            startsWith(inputs.environment, 'p') && 'Prod' ||
            startsWith(inputs.environment, 't') && 'Test' ||
            'Develop'
          ) ||
        github.ref_name == 'main' &&
          'Arcadia Prod' ||
        github.ref_name == 'develop' &&
          'Arcadia Test' ||
        'Arcadia Develop'
      }}

    strategy:
      matrix:
        node-version: [20.x]
        go-version: [1.23.x]

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        env:
          ARCADIA_DEVELOP_AWS_KEY: ${{ secrets.ARCADIA_DEVELOP_AWS_KEY }}
          ARCADIA_DEVELOP_AWS_SECRET: ${{ secrets.ARCADIA_DEVELOP_AWS_SECRET }}

          ARCADIA_TEST_AWS_KEY: ${{ secrets.ARCADIA_TEST_AWS_KEY }}
          ARCADIA_TEST_AWS_SECRET: ${{ secrets.ARCADIA_TEST_AWS_SECRET }}

          ARCADIA_PROD_AWS_KEY: ${{ secrets.ARCADIA_PROD_AWS_KEY }}
          ARCADIA_PROD_AWS_SECRET: ${{ secrets.ARCADIA_PROD_AWS_SECRET }}
        run: |
          mkdir ~/.aws && touch ~/.aws/credentials
          cat <<EOL >> ~/.aws/credentials
          [default]
          aws_access_key_id=nil
          aws_secret_access_key=nil

          [arcadia-develop]
          aws_access_key_id=$ARCADIA_DEVELOP_AWS_KEY
          aws_secret_access_key=$ARCADIA_DEVELOP_AWS_SECRET

          [arcadia-test]
          aws_access_key_id=$ARCADIA_TEST_AWS_KEY
          aws_secret_access_key=$ARCADIA_TEST_AWS_SECRET

          [arcadia-prod]
          aws_access_key_id=$ARCADIA_PROD_AWS_KEY
          aws_secret_access_key=$ARCADIA_PROD_AWS_SECRET
          EOL

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache node dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Use Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Cache Go dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Serverless Framework
        run: npm install -g serverless@4

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Go dependencies
        run: make upgrade

      - name: Run Go unit tests
        env:
          AWS_PROFILE: ${{ vars.CBG_ACCOUNT_SET }}-${{ vars.CBG_ENVIRONMENT }}
          DYNAMODB_TABLE_NAME: ${{ vars.DYNAMODB_TABLE_NAME }}
        run: make test

      - name: Update AWS SSM parameters
        env:
          AWS_REGION: us-west-2
          CBG_ACCOUNT_SET: ${{ vars.CBG_ACCOUNT_SET }}
          CBG_ENVIRONMENT: ${{ vars.CBG_ENVIRONMENT }}
          GRAPHQL_API_KEY: >-
            ${{
              github.ref_name == 'main'
                && secrets.HASURA_SLIPSPACE_COREAPI_API_KEY_PROD
                || secrets.HASURA_SLIPSPACE_COREAPI_API_KEY_NONPROD
            }}
        run: |
          ./scripts/update-params.sh -p "${CBG_ACCOUNT_SET}-${CBG_ENVIRONMENT}" -r "${AWS_REGION}" -s "${CBG_ENVIRONMENT}"

      - name: Build and deploy Serverless API
        env:
          AWS_REGION: us-west-2
          CBG_ACCOUNT_SET: ${{ vars.CBG_ACCOUNT_SET }}
          CBG_ENVIRONMENT: ${{ vars.CBG_ENVIRONMENT }}
          CUSTOMER: CBG
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: |
          make build
          ./scripts/deploy-serverless.sh -p "${CBG_ACCOUNT_SET}" -e "${CBG_ENVIRONMENT}" -c "${CUSTOMER}" -r "${AWS_REGION}"

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: >-
              ${{ job.status == 'success' &&
                  ':white_check_mark: Deployment successful' ||
                  ':x: Deployment failed'
              }} for ${{ github.repository }} to ${{ github.ref_name }}
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: >-
                    ${{ job.status == 'success' &&
                        ':white_check_mark: Deployment successful' ||
                        ':x: Deployment failed'
                    }} for ${{ github.repository }} to ${{ github.ref_name }}
              - type: section
                text:
                  type: mrkdwn
                  text: >-
                    ${{ job.status == 'success' &&
                        'Unit tests passed and Serverless API has been successfully deployed.' ||
                        'The deployment process has failed.
                        This could be due to failed unit tests or Serverless API deployment issues.
                        Please check the GitHub Actions logs for details.'
                    }}

  createRelease:
    name: Create GitHub release
    needs: buildTestAndDeploy
    if: github.ref_name == 'main' && success()
    runs-on: ubuntu-24.04
    environment: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
          format('Arcadia {0}',
            startsWith(inputs.environment, 'p') && 'Prod' ||
            startsWith(inputs.environment, 't') && 'Test' ||
            'Develop'
          ) ||
        github.ref_name == 'main' &&
          'Arcadia Prod' ||
        github.ref_name == 'develop' &&
          'Arcadia Test' ||
        'Arcadia Develop'
      }}
    permissions:
      contents: write

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important for getting git history

      - name: Generate version number
        id: version
        run: |
          VERSION=$(date '+%Y.%m.%d')-$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> ${GITHUB_OUTPUT}

      - name: Create release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            Release of version ${{ steps.version.outputs.version }}
            Automated release created by GitHub Actions.
          draft: false
          prerelease: false

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: >-
              ${{ job.status == 'success' &&
                  ':white_check_mark: Release successful' ||
                  ':x: Release failed'
              }} for ${{ github.repository }} to ${{ github.ref_name }}
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: >-
                    ${{ job.status == 'success' &&
                        ':white_check_mark: Release successful' ||
                        ':x: Release failed'
                    }} for ${{ github.repository }} to ${{ github.ref_name }}
              - type: section
                text:
                  type: mrkdwn
                  text: >-
                    ${{ job.status == 'success' &&
                        format('Release {0} has been successfully created.', steps.version.outputs.version) ||
                        format('Release {0} has failed to be created.', steps.version.outputs.version)
                    }}

  runPostmanTests:
    name: Run Postman tests
    needs: buildTestAndDeploy
    runs-on: ubuntu-24.04
    environment: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
          format('Arcadia {0}',
            startsWith(inputs.environment, 'p') && 'Prod' ||
            startsWith(inputs.environment, 't') && 'Test' ||
            'Develop'
          ) ||
        github.ref_name == 'main' &&
          'Arcadia Prod' ||
        github.ref_name == 'develop' &&
          'Arcadia Test' ||
        'Arcadia Develop'
      }}

    steps:
      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Run API tests
        run: |
          postman collection run "${{ secrets.POSTMAN_COLLECTION_ID }}" \
            -e "${{ secrets.POSTMAN_ENVIRONMENT_ID }}" \
            --verbose

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: >-
              ${{ job.status == 'success' &&
                  ':white_check_mark: Postman tests successful' ||
                  ':x: Postman tests failed'
              }} for ${{ github.repository }} to ${{ github.ref_name }}
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: >-
                    ${{ job.status == 'success' &&
                        ':white_check_mark: Postman tests successful' ||
                        ':x: Postman tests failed'
                    }} for ${{ github.repository }} to ${{ github.ref_name }}
              - type: section
                text:
                  type: mrkdwn
                  text: >-
                    ${{ job.status == 'success' &&
                        'Postman tests have been successfully completed.' ||
                        'Postman tests have failed.'
                    }}
